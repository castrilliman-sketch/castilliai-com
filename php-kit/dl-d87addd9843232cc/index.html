<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Thank you — PHP Security Self-Help Fix Kit</title>

    :root { --ink:#162127; --muted:#4d5c66; --line:#d9d3c7; --paper:#f3efe6; --accent:#1c5c45; --accent-dark:#134434; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 18px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--paper); }
    main { max-width: 36rem; margin: 12vh auto; padding: 0 1.25rem 4rem; }
    h1 { font-family: Georgia, "Iowan Old Style", Palatino, serif; font-size: 2rem; letter-spacing: -0.03em; margin: 0 0 0.75rem; font-weight: 600; }
    p { color: var(--muted); }
    .btn {
      display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
      font: inherit; font-weight: 600; padding: 0.75rem 1.2rem; border-radius: 8px; margin: 0.5rem 0 1.25rem;
      border: 0;
    }
    .btn:disabled { background: #8aa399; color: #f4f7f5; cursor: not-allowed; }
    .note { font-size: 0.95rem; border-top: 1px solid var(--line); padding-top: 1rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
